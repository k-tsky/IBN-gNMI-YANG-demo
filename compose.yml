services:
  yang-push:
    build: receivers/yang-push
    image: ibn-yang-push-receiver:netcalyx-0.3.0-telegraf-1.36.4
    command: ["--quiet", "--config", "/etc/telegraf/telegraf.conf"]
    restart: unless-stopped
    volumes:
      - ./configs/yang-push.toml:/etc/telegraf/telegraf.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':270F ' /proc/net/udp && grep -q ':2439 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 2s
      timeout: 1s
      retries: 15
    networks:
      lab:
        ipv4_address: 172.20.20.10
  gnmic:
    image: ghcr.io/openconfig/gnmic:0.42.1
    restart: unless-stopped
    command: ["--config", "/etc/gnmic/config.yml", "subscribe"]
    volumes:
      - ./configs/gnmic.yml:/etc/gnmic/config.yml:ro
    networks: [lab]
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [lab]
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/telemetry.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./configs/grafana:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    networks: [lab]
networks:
  lab:
    external: true
    name: clab
