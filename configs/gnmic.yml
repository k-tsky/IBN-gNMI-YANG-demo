username: clab
password: clab@123
insecure: true
encoding: json_ietf
api-server:
  address: :7890
  enable-metrics: true
targets:
  clab-telemetry-xrd:9339:
subscriptions:
  interface-state:
    paths:
      - openconfig-interfaces:/interfaces/interface[name=GigabitEthernet0/0/0/0]/state/oper-status
    mode: stream
    stream-mode: on-change
outputs:
  prometheus:
    type: prometheus
    listen: :9804
    strings-as-labels: true
    expiration: -1s
    # Keep the latest value per gNMI path, not a series for every past state.
    cache: {}
  stdout:
    type: file
    file-type: stdout
    format: json
  observations:
    type: file
    filename: /dev/null
    format: event
    split-events: true
    enable-metrics: true
    event-processors: [interface-observations]
  down-observations:
    type: file
    filename: /dev/null
    format: event
    split-events: true
    enable-metrics: true
    event-processors: [interface-down]
processors:
  interface-observations:
    event-allow:
      condition: '.tags.interface_name == "GigabitEthernet0/0/0/0" and any(.values | to_entries[]; .key | endswith("/oper-status"))'
  interface-down:
    event-allow:
      condition: '.tags.interface_name == "GigabitEthernet0/0/0/0" and any(.values | to_entries[]; (.key | endswith("/oper-status")) and (.value | tostring | split(":") | last) == "DOWN")'
