!
hostname {{ .ShortName }}
!
username clab
 group root-lr
 group cisco-support
 secret clab@123
!
grpc
 port 9339
 no-tls
 address-family dual
!
line default
 transport input ssh
!
interface MgmtEth0/RP0/CPU0/0
!
interface GigabitEthernet0/0/0/0
 description gNMI interface event demo
 no shutdown
!
router static
{{- if .MgmtIPv4Gateway }}
 address-family ipv4 unicast
  0.0.0.0/0 MgmtEth0/RP0/CPU0/0 {{ .MgmtIPv4Gateway }}
 !
{{- end}}
{{- if .MgmtIPv6Gateway }}
 address-family ipv6 unicast
  ::/0 MgmtEth0/RP0/CPU0/0 {{ .MgmtIPv6Gateway }}
 !
{{- end}}
!
yang-push
 receiver demo
  address 172.20.20.10
  port 9999
  transport udp-notif
 !
 subscription 100
  receiver demo
  filter xpath openconfig-interfaces:interfaces/interface[name=GigabitEthernet0/0/0/0]/state/oper-status
  encoding json
  update-policy on-change sync-on-start
  source-interface MgmtEth0/RP0/CPU0/0
 !
!
ssh server v2
end
