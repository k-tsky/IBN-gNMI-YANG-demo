name: telemetry
mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
topology:
  nodes:
    xrd:
      kind: cisco_xrd
      image: xrd-control-plane:26.2.1
      startup-config: configs/xrd.cfg
    peer:
      kind: linux
      image: alpine:3.21.3
      cmd: sleep infinity
      exec:
        - ip link set eth1 up
  links:
    - endpoints: ["xrd:Gi0-0-0-0", "peer:eth1"]
