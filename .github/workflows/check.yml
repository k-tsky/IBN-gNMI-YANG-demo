name: Validate lab
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: docker compose --profile gnmi config --quiet
      - run: python3 -m json.tool dashboards/telemetry.json > /dev/null
      - run: >-
          docker run --rm --network none
          -v "$PWD/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          --entrypoint promtool prom/prometheus:v3.2.1
          check config /etc/prometheus/prometheus.yml
